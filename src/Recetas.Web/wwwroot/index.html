<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recetas</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!--
      El SVG primero: escala sin perder nitidez y pesa menos que cualquier PNG.
      El PNG queda de respaldo para los navegadores que no admiten favicon en SVG,
      que lo ignoran cuando entienden el primero.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link href="Recetas.Web.styles.css" rel="stylesheet" />
    <!--
      Aquí NO va la etiqueta de mapa de importaciones que trae la plantilla de
      Blazor. El SDK la rellenaría con el mapa de huellas, y al ser un script en
      línea la política de seguridad de contenido la bloquea; sin la traducción,
      el navegador pide los ficheros por un nombre que no existe y Blazor no
      arranca. Ver el comentario de WasmFingerprintAssets en Recetas.Web.csproj.
    -->
</head>

<body>
    <!--
      Pantalla de carga. Blazor WebAssembly tarda en arrancar (descarga el runtime
      y los ensamblados), así que esto es lo primero y lo único que ve el usuario
      durante unos segundos: merece la pena que sea el icono de la aplicación.

      El SVG va incrustado, no como <img src="favicon.svg">: así aparece con el
      HTML, sin una petición más que retrasaría justo el momento que pretende
      cubrir. Es el mismo dibujo que favicon.svg; si cambia uno, cambian los dos.
    -->
    <div id="app">
        <div class="cargando">
            <svg class="cargando-icono" viewBox="0 0 64 64" role="img" aria-label="Recetas">
                <rect width="64" height="64" rx="14" fill="#b4541f" />
                <circle cx="32" cy="14" r="4" fill="#fdfcfa" />
                <rect x="11" y="19" width="42" height="7" rx="3.5" fill="#fdfcfa" />
                <rect x="6" y="31" width="9" height="7" rx="3.5" fill="#fdfcfa" />
                <rect x="49" y="31" width="9" height="7" rx="3.5" fill="#fdfcfa" />
                <rect x="14" y="29" width="36" height="23" rx="6" fill="#fdfcfa" />
            </svg>
            <p class="cargando-texto">Cargando…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Se ha producido un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <!--
      El marcador de huella lo sustituye el SDK al publicar, escribiendo el nombre
      real en el atributo src. Eso NO es un script en línea, así que la política de
      seguridad de contenido lo admite sin problema: lo que la infringía era el
      importmap. Los módulos que el runtime importa dinámicamente (dotnet.js y
      compañía) van sin huella, así que se resuelven por su nombre literal.
    -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
