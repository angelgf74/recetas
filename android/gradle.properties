org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX es obligatorio para Compose.
android.useAndroidX=true

# Kotlin genera código de forma incremental; sin esto, cada cambio recompila todo.
kotlin.code.style=official

# Evita que el complemento de Android traiga recursos de bibliotecas que no se
# usan, que es de donde salen la mayoría de los APK inflados.
android.nonTransitiveRClass=true
